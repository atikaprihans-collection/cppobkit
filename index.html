<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d6b57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Checklist CPPOB"><title>Checklist Inspeksi CPPOB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">

<title>Checklist Inspeksi CPPOB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: aplikasi satu kolom untuk HP; header kecil di atas, navigasi tab di bawah, kartu butir per bagian */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface2:#e8eeea; --ink:#13231c; --muted:#5a6b62; --line:#d3dcd6;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#d9efe7;
  --ok:#1b8a4b; --ok-soft:#dcf1e4; --mn:#a9710c; --mn-soft:#fbefd2; --mj:#cf5a1f; --mj-soft:#fbe3d6; --kt:#bf2630; --kt-soft:#f8dcde;
  --tb:#5a6b62; --tb-soft:#e3e9e5;
  --f-head:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211b; --surface2:#1d2b24; --ink:#e6f0ea; --muted:#9bb0a5; --line:#2b3b33;
  --accent:#4fc7a6; --accent-ink:#06231b; --accent-soft:#17382e;
  --ok:#5bd68d; --ok-soft:#173826; --mn:#e9b64d; --mn-soft:#3a2e12; --mj:#f08a55; --mj-soft:#3c2216; --kt:#ff7b82; --kt-soft:#40181b;
  --tb:#9bb0a5; --tb-soft:#24332b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --surface2:#1d2b24; --ink:#e6f0ea; --muted:#9bb0a5; --line:#2b3b33;
  --accent:#4fc7a6; --accent-ink:#06231b; --accent-soft:#17382e;
  --ok:#5bd68d; --ok-soft:#173826; --mn:#e9b64d; --mn-soft:#3a2e12; --mj:#f08a55; --mj-soft:#3c2216; --kt:#ff7b82; --kt-soft:#40181b;
  --tb:#9bb0a5; --tb-soft:#24332b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.top h1{font-size:17px;line-height:1.2}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{min-width:0;flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px;background:var(--surface2);white-space:nowrap}
.r-A{background:var(--ok-soft);color:var(--ok)}.r-B{background:var(--accent-soft);color:var(--accent)}
.r-C{background:var(--mj-soft);color:var(--mj)}.r-D{background:var(--kt-soft);color:var(--kt)}.r-none{background:var(--surface2);color:var(--muted)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:56px;position:relative}
.nav button[aria-current="true"]{color:var(--accent);font-weight:600}
.nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--kt);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-weight:600}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.h2{font-size:19px;margin:6px 0 10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--kt);border-color:var(--kt)}
.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible,.iconbtn:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
label.f{display:block;margin-bottom:10px;min-width:0}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 11px}
textarea{min-height:76px;resize:vertical}
/* list */
.insp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.insp .nm{font-weight:600;overflow-wrap:anywhere}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;padding:30px 10px}
.empty h2{font-size:22px;margin-bottom:6px}
/* checklist */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;white-space:nowrap;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sticky-sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);z-index:15;background:var(--bg);padding:6px 0 8px}
.sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.p-mn{background:var(--mn-soft);color:var(--mn)}.p-mj{background:var(--mj-soft);color:var(--mj)}.p-kt{background:var(--kt-soft);color:var(--kt)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-n{background:var(--surface2);color:var(--muted)}
.sec{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sec>button{width:100%;border:0;background:var(--surface);display:flex;gap:10px;align-items:center;text-align:left;padding:13px 14px;cursor:pointer;min-height:52px}
.sec>button b{font-family:var(--f-head);font-size:15.5px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.sec>button .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .chev{transition:transform .15s}.sec.open .chev{transform:rotate(90deg)}
.sec-body{border-top:1px solid var(--line)}
.it{padding:13px 14px;border-bottom:1px solid var(--line);border-left:5px solid transparent}
.it:last-child{border-bottom:0}
.it.s-ok{border-left-color:var(--ok)}.it.s-MN{border-left-color:var(--mn)}.it.s-MJ{border-left-color:var(--mj)}.it.s-KT{border-left-color:var(--kt)}.it.s-tb{border-left-color:var(--tb)}
.it-t{display:flex;gap:10px}
.no{font-family:var(--f-head);font-weight:700;min-width:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.it-t p{margin:0;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:58px;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="tb"]{background:var(--tb);border-color:var(--tb);color:#fff}
.seg button[aria-pressed="true"][data-v="MN"]{background:var(--mn);border-color:var(--mn);color:#fff}
.seg button[aria-pressed="true"][data-v="MJ"]{background:var(--mj);border-color:var(--mj);color:#fff}
.seg button[aria-pressed="true"][data-v="KT"]{background:var(--kt);border-color:var(--kt);color:#fff}
.seg button[data-v="MN"]:not([aria-pressed="true"]){color:var(--mn)}.seg button[data-v="MJ"]:not([aria-pressed="true"]){color:var(--mj)}.seg button[data-v="KT"]:not([aria-pressed="true"]){color:var(--kt)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b1410}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b1410}
.crit{margin-top:8px;font-size:12.5px;color:var(--muted)}
.crit summary{cursor:pointer;min-height:28px;display:flex;align-items:center}
.crit div{padding:2px 0}
.hint{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:8px}
.hint.MN{background:var(--mn-soft)}.hint.MJ{background:var(--mj-soft)}.hint.KT{background:var(--kt-soft)}
.mini{margin-top:10px;display:grid;gap:8px;padding:10px;border-radius:10px;background:var(--surface2)}
.mini textarea{min-height:88px}
.plor-h{font-family:var(--f-head);font-weight:700;font-size:14px}
[hidden]{display:none!important}
/* hasil */
.big{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rate{font-family:var(--f-head);font-weight:700;font-size:64px;line-height:1;width:96px;height:96px;border-radius:20px;display:grid;place-items:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.scroll{overflow-x:auto}
.tm{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;margin-bottom:12px;border-left:5px solid var(--mn)}
.tm.MJ{border-left-color:var(--mj)}.tm.KT{border-left-color:var(--kt)}
.tm h3{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:90vw}
.sync{font-size:12px;color:var(--muted)}
.capa{min-width:1000px;table-layout:fixed}
.capa th{background:var(--surface2);font-size:13px}
.capa td{padding:6px}
.capa td textarea{min-height:92px;font-size:14px}
.capa td.cn{text-align:center}
.capa th:nth-child(1){width:64px}.capa th:nth-child(2){width:250px}.capa th:nth-child(3){width:120px}.capa th:nth-child(4),.capa th:nth-child(5){width:200px}.capa th:nth-child(6){width:130px}.capa th:nth-child(7){width:170px}
.capa tr.off{opacity:.45}
.chk{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px}
canvas.pad{touch-action:none;width:100%;height:180px;background:#fff;border:1.5px dashed var(--accent);border-radius:10px;display:block;cursor:crosshair}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:100%;height:110px;object-fit:contain;display:block;margin:6px 0}
.locked input,.locked textarea,.locked select,.locked [data-act=status]{pointer-events:none;opacity:.6}
#printArea{display:none}
@media print{
 html,body{background:#fff!important;color:#000!important}
 body::before{display:none}
 #app,#toast{display:none!important}
 #printArea{display:block!important;font:11px Arial,sans-serif;color:#000}
 @page{size:A4 landscape;margin:12mm}
 .pp-id td{padding:2px 4px;font-size:11px}
 .pp-t{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px}
 .pp-t th,.pp-t td{border:1px solid #000;padding:4px;vertical-align:top;font-size:10.5px;overflow-wrap:anywhere;text-align:left}
 .pp-signs{display:flex;gap:30px;margin-top:18px;break-inside:avoid}
 .pp-sig{text-align:center;min-width:150px}.pp-sig img{height:60px;display:block;margin:4px auto}
 .pp-blank{height:60px}.pp-lbl{font-weight:700;margin-bottom:2px}
 .pp-tim{flex:1}.pp-timrow{display:flex;gap:18px;flex-wrap:wrap}
 thead{display:table-header-group}tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="toast" class="toast" hidden></div>
<div id="printArea"></div>

<script>
const SECTIONS = [{"title": "a. Komitmen Penanggung Jawab/Pemilik Sarana Produksi", "items": [{"no": 1, "text": "Pembentukan dan pemeliharaan budaya keamanan pangan di sarana produksi pangan olahan", "cats": ["MN", "MJ"], "desc": {"MN": "apabila belum secara konsisten membentuk dan memelihara budaya keamanan pangan", "MJ": "apabila penganggung jawab/pemilik tidak memiliki komitmen"}}]}, {"title": "b. Lingkungan Sarana Produksi (area luar atau eksternal)", "items": [{"no": 2, "text": "Lingkungan sarana produksi bersih dan terpelihara (tidak terdapat akumulasi debu, bebas ilalang, bebas sampah, bebas dari barang-barang tidak terpakai) (*)", "cats": ["MN"], "desc": {}}, {"no": 3, "text": "Tidak terdapat kontaminasi silang dari lingkungan (misal: Tempat sampah terbuka, terdapat tempat pemeliharaan hewan, genangan air)", "cats": ["MN"], "desc": {}}]}, {"title": "c. Konstruksi dan Layout Bangunan (dinding, lantai, langit-langit, pintu, jendela, dan perpipaan)", "items": [{"no": 4, "text": "Dinding bersih, tidak berjamur, tidak berlumut dan/atau tidak retak (*)", "cats": ["MN"], "desc": {}}, {"no": 5, "text": "Lantai bersih, tidak retak, dan/atau tidak ada genangan", "cats": ["MN"], "desc": {}}, {"no": 6, "text": "Langit-langit dan/atau atap bersih, tidak retak dan/atau catnya tidak mengelupas (*)", "cats": ["MN"], "desc": {}}, {"no": 7, "text": "Pintu ruangan produksi sebaiknya membuka ke arah luar dan dapat menutup secara sempurna atau menggunakan tirai ketika pintu terbuka (*)", "cats": ["MN"], "desc": {}}, {"no": 8, "text": "Jendela terbuka yang berhubungan dengan lingkungan luar dilengkapi dengan kasa pencegah serangga atau hama dan jendela mudah dibersihkan (*)", "cats": ["MN"], "desc": {}}, {"no": 9, "text": "Desain perpipaan mencegah kontaminasi silang", "cats": ["MJ"], "desc": {}}, {"no": 10, "text": "Terdapat program pemeliharaan bangunan yang dilakukan secara konsisten", "cats": ["MN"], "desc": {}}]}, {"title": "d. Area Pengolahan", "items": [{"no": 11, "text": function calc(o){
  let mn=0,mj=0,kt=0,ok=0,tb=0;
  for(const it of ITEMS){const s=(o.a[it.no]||{}).s;if(s==="MN")mn++;else if(s==="MJ")mj++;else if(s==="KT")kt++;else if(s==="ok")ok++;else if(s==="tb")tb++;}
  const done=mn+mj+kt+ok+tb, bobot=mn+mj*2;
  let rating=null; if(done>0){rating=kt>0?"D":bobot<=12?"A":bobot<=22?"B":bobot<=56?"C":"D";}
  return {mn,mj,kt,ok,tb,done,total:ITEMS.length,bobot,rating,temuan:mn+mj+kt};
}

/* ---- kanvas tanda tangan ---- */
function initPads(){
  document.querySelectorAll("canvas.pad").forEach(cv=>{
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(300,Math.floor(r.width*dpr));cv.height=Math.floor(180*dpr);
    const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";g.fillStyle="#111";
    let on=false,lx=0,ly=0;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    cv.addEventListener("pointerdown",e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}on=true;[lx,ly]=pos(e);cv.dataset.dirty="1";g.beginPath();g.arc(lx,ly,1.3,0,6.3);g.fill();});
    cv.addEventListener("pointermove",e=>{if(!on)return;e.preventDefault();const[x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;});
    const up=()=>{on=false;};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);cv.addEventListener("pointerleave",up);
  });
}
function normSig(cv){const W=600,H=200,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d"),s=Math.min(W/cv.width,H/cv.height),w=cv.width*s,h=cv.height*s;g.drawImage(cv,(W-w)/2,(H-h)/2,w,h);return c.toDataURL("image/png");}
/* ---- cetak PDF (versi mandiri) ---- */
function printCapa(){
  const o=cur();ensureCapa(o);
  if(window.claude){toast("Cetak tidak tersedia di tampilan ini. Pakai versi mandiri atau unduh .docx.");return;}
  const rows=capaRows(o).filter(r=>r.on);
  const id=[["Nama Sarana Produksi",o.cover.sarana||o.cover.perusahaan],["Alamat",o.cover.alamatPabrik],["Tujuan Inspeksi",o.cover.tujuan],["Tanggal Inspeksi",fmtDate(o.cover.tanggal)]];
  const sg=(s,t)=>`<div class="pp-sig"><div class="pp-lbl">${t}</div>${s.img?`<img src="${s.img}" alt="">`:`<div class="pp-blank"></div>`}<div><b>${esc(s.nama||"")}</b>${s.jabatan?`<br>${esc(s.jabatan)}`:""}${s.ts?`<br><small>Ditandatangani digital ${esc(fmtDT(s.ts))}</small>`:""}</div></div>`;
  $("#printArea").innerHTML=`<h2 style="text-align:center;margin:0 0 10px;font:700 15px Arial,sans-serif">FORM EVALUASI CAPA BADAN POM</h2>
   <table class="pp-id">${id.map(r=>`<tr><td style="width:150px">${r[0]}</td><td>:&nbsp;${esc(r[1])}</td></tr>`).join("")}</table>
   <table class="pp-t"><thead><tr><th style="width:30px">No.</th><th>Temuan</th><th style="width:70px">Klasifikasi Temuan</th><th>GAP Analysis</th><th>CAPA</th><th style="width:90px">Waktu Penyelesaian</th><th>Hasil Evaluasi</th></tr></thead><tbody>
   ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.t)}</td><td>${esc(r.kl)}</td><td>${esc(r.gap)}</td><td>${esc(r.capa)}</td><td>${esc(r.due)}</td><td>${esc(r.ev)}</td></tr>`).join("")}</tbody></table>
   <div class="pp-signs">${sg(o.sig.pj,"Pimpinan/Penanggung Jawab")}<div class="pp-tim"><div class="pp-lbl">Tim Inspeksi</div><div class="pp-timrow">${o.tim.map(m=>sg(m,"")).join("")}</div></div></div>`;
  setTimeout(()=>window.print(),50);
}
function updateHeader(){
  const o=cur();if(!o||ui.view!=="insp")return;const c=calc(o);
  const r=$("#hdrRate");if(r){r.className="chip "+(c.rating?"r-"+c.rating:"r-none");r.textContent=c.rating?"Rating "+c.rating:"Belum dinilai";}
  const sub=document.querySelector(".top .sub");if(sub)sub.textContent=fmtDate(o.cover.tanggal)+" · "+c.done+"/"+c.total+" butir terisi"+(o.shared&&teamOn()?" · "+teamStatus(o):"");
  const t=document.querySelector(".top h1");if(t)t.textContent=o.cover.sarana||o.cover.perusahaan||"Inspeksi tanpa nama";
}

/* ---------- export ---------- */
function petugas(o){return [o.cover.petugas1,o.cover.petugas2,o.cover.petugas3].filter(Boolean).join("; ");}
function recapHeader(){return ["ID","Tanggal","Nama Sarana","Perusahaan","Alamat Pabrik","Kota","Jenis Pangan","Petugas","MN","MJ","KT","Jumlah Bobot","Rating","Jumlah Temuan","Butir Terisi","Diperbarui"].concat(ITEMS.map(i=>"P"+i.no));}
function recapRow(o){const c=calc(o);return [o.id,o.cover.tanggal||"",o.cover.sarana||"",o.cover.perusahaan||"",o.cover.alamatPabrik||"",o.cover.kotaP||"",o.cover.jenisPangan||"",petugas(o),c.mn,c.mj,c.kt,c.bobot,c.rating||"",c.temuan,c.done,new Date(o.updatedAt).toISOString()].concat(ITEMS.map(i=>{const s=(o.a[i.no]||{}).s;return s==="ok"?"OK":s==="tb"?"TB":s||"";}));}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

async function inflateRaw(u8){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer());}
async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("Templat rusak");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true),ds=lo+30+lnl+lel;
    const raw=u8.subarray(ds,ds+csize);
    files[name]=method===0?raw.slice():await inflateRaw(raw);
    p+=46+nl+el+cl;
  }

}
function zip(files){
  const parts=[],cd=[];let off=0,size=0;
  for(const [name,data] of Object.entries(files)){
    const nb=te.encode(name),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+data.length;
  }
  const cdSize=cd.reduce((s,x)=>s+x.length,0),cnt=Object.keys(files).length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,cnt,true);end.setUint16(10,cnt,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  const all=[...parts,...cd,new Uint8Array(end.buffer)];size=all.reduce((s,x)=>s+x.length,0);
  const out=new Uint8Array(size);let q=0;for(const x of all){out.set(x,q);q+=x.length;}return out;
}

/* ---------- edit sheet XML ---------- */
const colNum=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n;};
const splitRef=r=>{const m=/^([A-Z]+)(\d+)$/.exec(r);return [colNum(m[1]),+m[2],m[1]];};
class Sheet{
  constructor(xml){this.doc=new DOMParser().parseFromString(xml,"application/xml");this.sd=this.doc.getElementsByTagNameNS(XNS,"sheetData")[0];this.rows=new Map();for(const r of this.sd.children)this.rows.set(+r.getAttribute("r"),r);}
  prevRow(n){let p=null;for(const [k,v] of this.rows)if(k<n&&(!p||k>p.k))p={k,v};return p;}
  row(n){let r=this.rows.get(n);if(r)return r;r=this.doc.createElementNS(XNS,"row");r.setAttribute("r",n);const p=this.prevRow(n);if(p)p.v.after(r);else this.sd.prepend(r);this.rows.set(n,r);return r;}
  cell(ref){const [c,rn]=splitRef(ref),row=this.row(rn);
    for(const x of row.children){const xc=splitRef(x.getAttribute("r"))[0];if(xc===c)return x;if(xc>c){const el=this.doc.createElementNS(XNS,"c");el.setAttribute("r",ref);row.insertBefore(el,x);return el;}}
    const el=this.doc.createElementNS(XNS,"c");el.setAttribute("r",ref);row.appendChild(el);return el;}
  set(ref,v){
    if(v===""||v==null)return;const c=this.cell(ref);while(c.firstChild)c.removeChild(c.firstChild);
    const is=this.doc.createElementNS(XNS,"is"),t=this.doc.createElementNS(XNS,"t");t.setAttributeNS(XMLNS,"xml:space","preserve");t.textContent=String(v);is.appendChild(t);c.setAttribute("t","inlineStr");c.appendChild(is);}
  cache(ref,val){const c=this.cell(ref);let v=c.getElementsByTagNameNS(XNS,"v")[0];if(!v){v=this.doc.createElementNS(XNS,"v");c.appendChild(v);}v.textContent=String(val);if(typeof val==="string")c.setAttribute("t","str");else c.removeAttribute("t");}
  setHt(n,ht){const r=this.row(n);r.setAttribute("ht",ht.toFixed(2));r.setAttribute("customHeight","1");}
  shift(from,delta){
    const list=[...this.rows.entries()].filter(([k])=>k>=from).sort((a,b)=>b[0]-a[0]);
    for(const [k,r] of list){this.rows.delete(k);const nk=k+delta;r.setAttribute("r",nk);for(const c of r.children){const m=splitRef(c.getAttribute("r"));c.setAttribute("r",m[2]+nk);}this.rows.set(nk,r);}
    for(const m of this.doc.getElementsByTagNameNS(XNS,"mergeCell"))m.setAttribute("ref",m.getAttribute("ref").replace(/([A-Z]+)(\d+)/g,(s,c,r)=>+r>=from?c+(+r+delta):s));}
  cloneRow(srcN,newN){const r=this.rows.get(srcN).cloneNode(true);r.setAttribute("r",newN);for(const c of r.children)c.setAttribute("r",splitRef(c.getAttribute("r"))[2]+newN);this.prevRow(newN).v.after(r);this.rows.set(newN,r);}
  addMerge(ref){const mcs=this.doc.getElementsByTagNameNS(XNS,"mergeCells")[0];const m=this.doc.createElementNS(XNS,"mergeCell");m.setAttribute("ref",ref);mcs.appendChild(m);mcs.setAttribute("count",mcs.children.length);}

}

function fillKhusus(sh,o){

  else if(k.smm==="Tidak"){sh.set("C4","(√) b. Tidak");}
  const L=["a","b","c"];
  [["c1j","c1m","c1l"],["c2j","c2m","c2l"],["c3j","c3m","c3l"]].forEach((ks,i)=>ks.forEach((key,j)=>{if(k[key])sh.set("C"+(5+i*3+j),L[j]+". "+k[key]);}));

function fillChecklist(sh,o,c){

function fillTemuan(sh,o,L){
  const k=L.length,extra=Math.max(0,k-9),e2=2*extra;
  if(extra){sh.shift(22,e2);for(let j=0;j<extra;j++){const r=22+2*j;sh.cloneRow(20,r);sh.cloneRow(21,r+1);for(const ch of "ABCDE")sh.addMerge(ch+r+":"+ch+(r+1));}
    const dim=sh.doc.getElementsByTagNameNS(XNS,"dimension")[0];if(dim)dim.setAttribute("ref","A1:E"+(30+e2));}
  const W=[20.7,34.4,27,49.1,27.4];
  L.forEach((it,i)=>{const a=o.a[it.no],r=4+2*i;
    const vals=[it.no+" ("+LABEL[a.s]+")",a.prob||autoProb(it,a.s),a.loc||"",a.ev||"",a.ref||autoRef(o,it)];
    let lines=1;vals.forEach((v,j)=>{const cpl=Math.max(8,Math.floor(W[j]*0.66));const n=String(v).split("\n").reduce((s,p)=>s+Math.max(1,Math.ceil(p.length/cpl)),0);lines=Math.max(lines,n);});
    const total=Math.max(31.5,lines*13.2+12);
    "ABCDE".split("").forEach((ch,j)=>sh.set(ch+r,vals[j]));sh.setHt(r,total/2);sh.setHt(r+1,total/2);});
  const c=o.cover;
  sh.set("A"+(23+e2),(c.kotaP||"……")+", "+(fmtDate(c.tanggal)||"……"));
  if(c.petugas1)sh.set("D"+(25+e2),"1. "+c.petugas1);if(c.petugas2)sh.set("D"+(27+e2),"2. "+c.petugas2);if(c.petugas3)sh.set("D"+(29+e2),"3. "+c.petugas3);
  if(c.pimpinan)sh.set("A"+(29+e2),c.pimpinan);
}

/* ---------- form CAPA (.docx) ---------- */
function fillP(doc,p,text,color){
  if(!p||text===""||text==null)return;
  const ppr=[...p.children].find(e=>e.localName==="pPr"),mark=ppr&&[...ppr.children].find(e=>e.localName==="rPr");
  const r=doc.createElementNS(WNS,"w:r");
  if(mark){const m=mark.cloneNode(true);for(const x of [...m.children])if(["color","b","bCs","i","iCs"].includes(x.localName))m.removeChild(x);
    if(color){const cl=doc.createElementNS(WNS,"w:color");cl.setAttributeNS(WNS,"w:val",color);const sz=[...m.children].find(x=>x.localName==="sz");sz?m.insertBefore(cl,sz):m.appendChild(cl);}
    r.appendChild(m);}
  String(text).split("\n").forEach((l,i)=>{if(i)r.appendChild(doc.createElementNS(WNS,"w:br"));const t=doc.createElementNS(WNS,"w:t");t.setAttributeNS(XMLNS,"xml:space","preserve");t.textContent=l;r.appendChild(t);});
  p.appendChild(r);
}
function stripIds(el){for(const n of [el,...el.getElementsByTagName("*")])for(const a of [...n.attributes])if(a.localName==="paraId"||a.localName==="textId")n.removeAttributeNode(a);}
function drawingRun(rid,id,cx,cy){
  const xml=`<w:r xmlns:w="${WNS}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="TTD ${id}"/><wp:cNvGraphicFramePr/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="ttd${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  return new DOMParser().parseFromString(xml,"application/xml").documentElement;
}
async function doDocx(){
  const o=cur();ensureCapa(o);
  try{
    const files=await unzip(b64ToU8(TPL.docx)),R=capaRows(o).filter(r=>r.on);
    const doc=new DOMParser().parseFromString(td.decode(files["word/document.xml"]),"application/xml");
    const tbls=doc.getElementsByTagNameNS(WNS,"tbl"),kids=(e,n)=>[...e.children].filter(x=>x.localName===n);
    const para=tc=>tc.getElementsByTagNameNS(WNS,"p")[0];
    [...tbls[0].getElementsByTagNameNS(WNS,"t")].forEach(t=>{if(t.textContent.trim()==="Peredaran")t.textContent="Produksi";});
    const hv=[o.cover.sarana||o.cover.perusahaan,o.cover.alamatPabrik,o.cover.tujuan,fmtDate(o.cover.tanggal)];
    kids(tbls[0],"tr").forEach((tr,i)=>fillP(doc,para(kids(tr,"tc")[2]),hv[i]));
    const main=tbls[1];let data=kids(main,"tr").slice(1);
    while(data.length<R.length){const last=data[data.length-1],cl=last.cloneNode(true);stripIds(cl);last.after(cl);data.push(cl);
      const tcell=kids(cl,"tc")[0].getElementsByTagNameNS(WNS,"t")[0];if(tcell)tcell.textContent=String(data.length);}
    R.forEach((r,i)=>{const tc=kids(data[i],"tc");
      [r.t,r.kl,r.gap,r.capa,r.due,r.ev].forEach((v,j)=>fillP(doc,para(tc[j+1]),v,j===1?"FF0000":null));});
    /* pengesahan + tanda tangan */
    const media=[];
    const addImg=(p,dataUrl,cx,cy)=>{const n=media.length+1,rid="rIdTtd"+n;media.push({n,rid,bytes:b64ToU8(dataUrl.split(",")[1])});p.appendChild(doc.importNode(drawingRun(rid,1000+n,cx,cy),true));};
    const nested=tbls[3];
    if(nested){
      const rows=kids(nested,"tr"),c=kids(rows[1],"tc"),ps=kids(c[0],"p"),pj=o.sig.pj;
      if(pj.img&&ps[0])addImg(ps[0],pj.img,1500000,500000);
      if(ps[3]&&pj.ts)fillP(doc,ps[3],"Ditandatangani digital "+fmtDT(pj.ts));
      if(ps[4]&&pj.nama)fillP(doc,ps[4],pj.nama);
      if(ps[5]&&pj.jabatan)fillP(doc,ps[5],pj.jabatan);
      const tplP=ps[0],cell=c[4];
      const newP=()=>{const p=doc.createElementNS(WNS,"w:p"),ppr=[...tplP.children].find(e=>e.localName==="pPr");if(ppr)p.appendChild(ppr.cloneNode(true));cell.appendChild(p);return p;};
      o.tim.forEach((m,i)=>{
        if(m.img)addImg(newP(),m.img,1500000,500000);else newP();
        fillP(doc,newP(),(i+1)+". "+(m.nama||""));
        if(m.ts)fillP(doc,newP(),"Ditandatangani digital "+fmtDT(m.ts));
      });
    }
    files["word/document.xml"]=te.encode(ser(doc));
    if(media.length){
      let ct=td.decode(files["[Content_Types].xml"]);
      if(!/Extension="png"/.test(ct))ct=ct.replace("<Default Extension=\"jpg\"",'<Default Extension="png" ContentType="image/png"/><Default Extension="jpg"');
      files["[Content_Types].xml"]=te.encode(ct);
      let rels=td.decode(files["word/_rels/document.xml.rels"]);
      rels=rels.replace("</Relationships>",media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/ttd${m.n}.png"/>`).join("")+"</Relationships>");
      files["word/_rels/document.xml.rels"]=te.encode(rels);
      media.forEach(m=>{files["word/media/ttd"+m.n+".png"]=m.bytes;});
    }
    await saveFile(fname(o,"docx").replace("CPPOB_","CAPA_"),zip(files));
  }catch(e){console.error(e);toast("Gagal membuat form CAPA: "+(e&&e.message||"coba lagi"));}
}

let remote=null, remoteReady=false, timers={};
function syncText(){return remote?(remoteReady?"tersinkron online":"menyambung..."):"tersimpan di perangkat";}
function queueRemote(id){if(!remote)return;clearTimeout(timers[id]);timers[id]=setTimeout(()=>pushRemote(id),1500);}

async function initRemote(){
  try{
    if(!window.claude)return;
    const db=await claude.use("db");if(!db)return;
    remote=db.collection("inspeksi");
    let first=true;
    remote.onSnapshot(snap=>{
      const seen=new Set();let changed=false;
      snap.docs.forEach(d=>{seen.add(d.id);const v=d.data()||{};if(!v.json)return;let r;try{r=JSON.parse(v.json);}catch(e){return;}
        const i=store.list.findIndex(x=>x.id===d.id);
        if(i<0){store.list.push(r);changed=true;}else if((r.updatedAt||0)>(store.list[i].updatedAt||0)){if(!(ui.view==="insp"&&ui.id===d.id&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){store.list[i]=r;changed=true;}}});
      if(first){store.list.forEach(o=>{if(!seen.has(o.id))pushRemote(o.id);});}
      else{snap.docChanges().forEach(ch=>{if(ch.type==="removed"){const i=store.list.findIndex(x=>x.id===ch.doc.id);if(i>=0){store.list.splice(i,1);changed=true;if(ui.id===ch.doc.id){ui.view="home";}}}});}
      first=false;remoteReady=true;store.list.sort((a,b)=>b.updatedAt-a.updatedAt);saveLocal();
      if(changed||ui.view==="home")render();
    },()=>{remoteReady=false;});
  }catch(e){}
}

/* ---------- mode tim: Google Sheets + Apps Script ---------- */
const TM_KEY="cppob_team";
let tm=null;
try{const r=JSON.parse(localStorage.getItem(TM_KEY)||"null");if(r&&r.url&&r.code&&r.name)tm=r;}catch(e){}
const teamOn=()=>!!tm&&!window.claude;
const SY={}, DK=["s","prob","loc","ev","ref","gap","capa","due","evalr","capaOff","pe","re"], FLAGS=["capaOff","pe","re"];
let RL=[], RLerr="", tmTimers={}, pendR=false;
function sy(o){
  if(!o.sync)o.sync={vers:{},shadow:{},by:{},since:0,metaTs:0,shadowMeta:null,sigSent:{},ready:true};
  const T=SY[o.id]||(SY[o.id]={cf:{},sigMap:{},online:[],st:"",err:"",busy:false,pend:false});
  return {S:o.sync,T};
}
function hsh(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return s.length+":"+(h>>>0).toString(36);}
function ansData(a){const d={};if(!a)return d;DK.forEach(k=>{const v=a[k];if(v===undefined||v===null||v===""||v===false)return;d[k]=FLAGS.includes(k)?true:String(v);});return d;}
const ansKey=a=>JSON.stringify(ansData(a));
const sigSlots=o=>{ensureCapa(o);return [["sig.pj",o.sig.pj],...o.tim.map((m,i)=>["tim."+i,m])];};
function metaOf(o){
  ensureCapa(o);
  const sg=s=>{const x={nama:s.nama||"",jabatan:s.jabatan||"",ts:s.ts||0};const h=s.img?hsh(s.img):(s.ts?s.h:undefined);if(h)x.h=h;return x;};
  return {cover:o.cover,umum:o.umum,khusus:o.khusus,capaExtra:o.capaExtra,tim:o.tim.map(sg),sig:{pj:sg(o.sig.pj)},final:o.final||null,rev:o.rev||0,log:(o.log||[]).slice(-40)};
}
function isDirty(o){
  const {S,T}=sy(o);if(!S.ready)return false;
  for(const it of ITEMS){if(T.cf[it.no])continue;if(ansKey(o.a[it.no])!==(S.shadow[it.no]===undefined?"{}":S.shadow[it.no]))return true;}
  if(JSON.stringify(metaOf(o))!==S.shadowMeta)return true;
  return sigSlots(o).some(([p,s])=>s.img&&S.sigSent[p]!==hsh(s.img)&&s.img.length<=48000);
}
async function tmCall(method,payload){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    let res;
    if(method==="GET")res=await fetch(tm.url+(tm.url.includes("?")?"&":"?")+new URLSearchParams(payload).toString(),{signal:ctl.signal});
    else res=await fetch(tm.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:ctl.signal});
    const txt=await res.text();let j;
    try{j=JSON.parse(txt);}catch(e){throw new Error("server tidak membalas dengan benar; cek URL web app dan akses 'Anyone'");}
    if(!j.ok)throw new Error(j.error||"server menolak");
    return j;
  }catch(e){if(e.name==="AbortError")throw new Error("waktu habis, sinyal lemah?");if(e instanceof TypeError)throw new Error("tidak bisa terhubung (offline atau URL salah)");throw e;}
  finally{clearTimeout(t);}
}
async function tmPush(o){
  const {S,T}=sy(o),sent={};
  const answers=[];
  ITEMS.forEach(it=>{if(T.cf[it.no])return;const k=ansKey(o.a[it.no]);if(k!==(S.shadow[it.no]===undefined?"{}":S.shadow[it.no])){sent[it.no]=k;answers.push({no:it.no,base:S.vers[it.no]||0,data:ansData(o.a[it.no])});}});
  const mj=JSON.stringify(metaOf(o)),meta=mj!==S.shadowMeta;
  const sigs=[],sh={};
  sigSlots(o).forEach(([p,s])=>{if(s.img&&S.sigSent[p]!==hsh(s.img)&&s.img.length<=48000){sigs.push({path:p,nama:s.nama||"",img:s.img});sh[p]=hsh(s.img);}});
  if(!answers.length&&!meta&&!sigs.length)return;
  const body={action:"push",code:tm.code,insp:o.id,by:tm.name,answers,sigs,rekap:{header:recapHeader(),row:recapRow(o)}};
  if(meta)body.meta=JSON.parse(mj);
  const r=await tmCall("POST",body);
  (r.results||[]).forEach(x=>{S.vers[x.no]=x.ver;S.shadow[x.no]=sent[x.no];S.by[x.no]={n:tm.name,ts:x.ts};});
  (r.conflicts||[]).forEach(c=>{T.cf[c.no]=c.current;});
  if(meta){S.shadowMeta=mj;if(r.metaTs)S.metaTs=r.metaTs;}
  Object.assign(S.sigSent,sh);
  saveLocal();
}
function applyMeta(o,m){
  const {S,T}=sy(o),pool={};
  sigSlots(o).forEach(([p,s])=>{if(s.img)pool[hsh(s.img)]=s.img;});
  Object.values(T.sigMap).forEach(e=>{pool[e.h]=e.img;});
  o.cover=m.cover||{};o.umum=m.umum||{};o.khusus=m.khusus||{};o.capaExtra=m.capaExtra||[];o.final=m.final||null;o.rev=m.rev||0;o.log=m.log||[];
  o.sig={pj:Object.assign({},(m.sig||{}).pj)};o.tim=(m.tim||[]).map(x=>Object.assign({},x));
  sigSlots(o).forEach(([p,s])=>{if(s.h&&pool[s.h])s.img=pool[s.h];});
  S.shadowMeta=JSON.stringify(metaOf(o));
}
async function tmPull(o){
  const {S,T}=sy(o);
  const r=await tmCall("GET",{action:"pull",code:tm.code,insp:o.id,since:S.since,metaTs:S.metaTs,name:tm.name});
  let changed=false;
  (r.answers||[]).forEach(x=>{
    S.since=Math.max(S.since,x.ts||0);
    if(x.ver===S.vers[x.no])return;
    const dirty=S.ready&&ansKey(o.a[x.no])!==(S.shadow[x.no]===undefined?"{}":S.shadow[x.no]);
    if(dirty){if(T.cf[x.no])T.cf[x.no]={by:x.by,ver:x.ver,data:x.data};return;}
    o.a[x.no]=Object.assign({},x.data);S.vers[x.no]=x.ver;S.shadow[x.no]=ansKey(o.a[x.no]);S.by[x.no]={n:x.by,ts:x.ts};delete T.cf[x.no];changed=true;
  });
  (r.sigs||[]).forEach(x=>{
    S.since=Math.max(S.since,x.ts||0);
    if(!x.img)return;const h=hsh(x.img);T.sigMap[x.path]={img:x.img,h};
    sigSlots(o).forEach(([p,s])=>{if(p===x.path&&s.h===h&&!s.img){s.img=x.img;changed=true;}});
  });
  if(r.meta){
    const dirtyMeta=S.ready&&JSON.stringify(metaOf(o))!==S.shadowMeta;
    S.metaTs=r.metaTs||S.metaTs;
    if(!dirtyMeta){applyMeta(o,r.meta);changed=true;}
  }
  T.online=(r.online||[]).filter(n=>n!==tm.name);
  S.ready=true;
  saveLocal();
  return changed;
}
async function syncNow(id){
  const o=store.list.find(x=>x.id===id);if(!o||!o.shared||!teamOn())return;
  const {S,T}=sy(o);if(T.busy){T.pend=true;return;}
  T.busy=true;let changed=false;
  try{
    if(S.ready)await tmPush(o);
    changed=await tmPull(o);
    T.st="ok";T.err="";T.okAt=Date.now();
  }catch(e){T.st="err";T.err=String(e.message||e);}
  finally{
    T.busy=false;
    if(changed&&ui.view==="insp"&&ui.id===id)safeRender();else updateHeader();
    if(T.pend){T.pend=false;queueTeam(id,300);}
  }
}
function queueTeam(id,ms){if(!teamOn())return;const o=store.list.find(x=>x.id===id);if(!o||!o.shared)return;clearTimeout(tmTimers[id]);tmTimers[id]=setTimeout(()=>syncNow(id),ms||1200);}
function teamStatus(o){
  if(!teamOn()||!o.shared)return "";
  const {T}=sy(o),n=Object.keys(T.cf).length;
  let s;
  if(n)s=n+" butir bentrok, pilih di checklist";
  else if(T.st==="err")s="Belum tersimpan ke server ("+T.err+"). Dicoba lagi otomatis";
  else if(isDirty(o)||T.busy)s="Menyimpan ke server...";
  else if(T.st==="ok")s="Tersimpan di server "+fmtDT(T.okAt).slice(-5);
  else s="Menyambung ke server...";
  if(T.online.length)s+=" · Online: "+T.online.join(", ");
  return s;
}
function teamTag(o,no){

function teamShareHTML(o){
  if(window.claude||!tm)return"";
  return o.shared?`<div class="note" style="border-style:solid">Inspeksi ini dibagikan ke tim. Petugas lain bisa membukanya dari beranda dan mengisi bersamaan.</div>`
   :`<div class="card"><b>Kerja bersama tim</b><p class="small muted" style="margin:4px 0 8px">Unggah inspeksi ini ke spreadsheet tim supaya petugas lain bisa ikut mengisi.</p><button class="btn pri" data-act="tmShare">Bagikan ke tim</button></div>`;
}
function teamHomeHTML(){
  if(window.claude)return `<p class="small muted" style="margin-top:14px">Mode tim (Google Sheets) hanya aktif di versi mandiri (alamat GitHub), tidak di tampilan Claude.</p>`;
  const mine=new Set(store.list.map(x=>x.id)),rem=RL.filter(x=>!mine.has(x.id));
  const list=tm?`<div class="row" style="margin:10px 0 6px;align-items:center;justify-content:space-between"><b>Inspeksi di server tim</b><button class="btn" data-act="tmList">Muat ulang</button></div>${RLerr?`<p class="small" style="color:var(--bad,#b3261e)">${esc(RLerr)}</p>`:""}${rem.length?rem.map(x=>`<div class="insp" style="cursor:default"><div style="flex:1"><div class="nm">${esc(x.sarana||x.perusahaan||"Tanpa nama")}</div><div class="small muted">${esc(fmtDate(x.tanggal))} · ${x.done}/${ITEMS.length} butir · ${x.temuan} temuan${x.by?" · terakhir oleh "+esc(x.by):""}</div></div><button class="btn pri" data-act="tmOpen" data-id="${x.id}">Buka</button></div>`).join(""):`<p class="small muted">Tidak ada inspeksi lain di server.</p>`}`:"";
  return `<details class="card" style="margin-top:16px" ${tm?"":"open"}><summary style="font-family:var(--f-head);font-weight:700;cursor:pointer;min-height:32px;font-size:16px">Pengaturan tim ${tm?'<span class="pill p-ok">Aktif</span>':""}</summary>
  <div style="margin-top:10px"><label class="f"><span>URL Web App (berakhiran /exec)</span><input id="tmUrl" type="url" value="${esc(tm?tm.url:"")}" placeholder="https://script.google.com/macros/s/.../exec"></label>
  <label class="f"><span>Kode tim</span><input id="tmCode" type="text" value="${esc(tm?tm.code:"")}" autocapitalize="off" autocomplete="off"></label>
  <label class="f"><span>Namamu (tampil ke petugas lain)</span><input id="tmName" type="text" value="${esc(tm?tm.name:"")}"></label>
  <div class="row"><button class="btn pri" data-act="tmSave">Simpan dan tes</button>${tm?'<button class="btn" data-act="tmTest">Tes koneksi</button><button class="btn danger" data-act="tmClear">Hapus pengaturan</button>':""}</div>
  <p class="small muted" id="tmMsg" role="status" style="margin:8px 0 0"></p></div></details>${list}`;
}
function tmMsg(t){const e=document.getElementById("tmMsg");if(e)e.textContent=t;}
async function tmTest(){
  tmMsg("Menghubungi server...");
  try{const r=await tmCall("GET",{action:"ping",code:tm.code});tmMsg("Tersambung ke spreadsheet: "+(r.spreadsheet||"?"));tmLoadList();}catch(e){tmMsg("Gagal: "+(e.message||e));}
}
async function tmLoadList(){
  if(!teamOn())return;
  try{const r=await tmCall("GET",{action:"list",code:tm.code});RL=r.list||[];RLerr="";}catch(e){RLerr="Daftar server gagal dimuat: "+(e.message||e);}
  if(ui.view==="home")safeRender();
}
function busyInput(){const a=document.activeElement;return (a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||!!document.querySelector("canvas.pad[data-dirty]");}
function safeRender(){if(busyInput()){pendR=true;return;}pendR=false;render();}
document.addEventListener("focusout",()=>{if(pendR)setTimeout(()=>{if(pendR&&!busyInput())safeRender();},400);});
function tmAct(act,b){
  if(act==="tmSave"){
    const u=(document.getElementById("tmUrl").value||"").trim(),c=(document.getElementById("tmCode").value||"").trim(),n=(document.getElementById("tmName").value||"").trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){tmMsg("URL harus berawalan https://script.google.com/ dan berakhiran /exec");return true;}
    if(!c||!n){tmMsg("Kode tim dan namamu wajib diisi");return true;}
    tm={url:u,code:c,name:n};try{localStorage.setItem(TM_KEY,JSON.stringify(tm));}catch(e){}
    tmTest();return true;
  }
  if(act==="tmTest"){tmTest();return true;}
  if(act==="tmClear"){tm=null;RL=[];try{localStorage.removeItem(TM_KEY);}catch(e){}render();return true;}
  if(act==="tmList"){tmLoadList();return true;}
  if(act==="tmShare"){const o=cur();if(!o||!teamOn())return true;o.shared=true;o.sync=null;sy(o);o.sync.ready=true;saveLocal();render();toast("Mengunggah ke server tim...");syncNow(o.id);return true;}
  if(act==="tmOpen"){
    const x=RL.find(r=>r.id===b.dataset.id);if(!x)return true;
    if(!store.list.find(o=>o.id===x.id)){const o={id:x.id,createdAt:Date.now(),updatedAt:Date.now(),cover:{},umum:{},khusus:{},a:{},shared:true};
      o.sync={vers:{},shadow:{},by:{},since:0,metaTs:0,shadowMeta:null,sigSent:{},ready:false};store.list.unshift(o);saveLocal();}
    ui.id=x.id;ui.view="insp";ui.tab="cek";ui.filter="all";render();window.scrollTo(0,0);syncNow(x.id);return true;
  }
  if(act==="cfTheirs"||act==="cfMine"){
    const o=cur(),no=+b.dataset.no,{S,T}=sy(o),cf=T.cf[no];if(!cf)return true;
    if(act==="cfTheirs"){o.a[no]=Object.assign({},cf.data);S.vers[no]=cf.ver;S.shadow[no]=ansKey(o.a[no]);S.by[no]={n:cf.by,ts:cf.ts};delete T.cf[no];saveLocal();render();}
    else{S.vers[no]=cf.ver;delete T.cf[no];render();queueTeam(o.id,200);}
    return true;
  }
  return false;
}
setInterval(()=>{
  if(!teamOn())return;
  if(ui.view==="insp"){const o=cur();if(o&&o.shared)syncNow(o.id);}
  else if(!document.hidden&&(Date.now()%3===0||!RL.length))tmLoadList();
},5000);

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;if(tmAct(act,b))return;
  if(act==="new"||act==="sample"){const o=newInsp(act==="sample");ui.id=o.id;ui.view="insp";ui.tab=act==="sample"?"cek":"sarana";ui.open=new Set([0]);ui.filter="all";saveLocal();queueRemote(o.id);render();window.scrollTo(0,0);}
  else if(act==="open"){ui.id=b.dataset.id;ui.view="insp";ui.tab="cek";ui.filter="all";render();window.scrollTo(0,0);}
  else if(act==="home"){ui.view="home";ui.confirmDel=null;render();window.scrollTo(0,0);}
  else if(act==="del"){ui.confirmDel=b.dataset.id;render();}
  else if(act==="delyes"){const id=b.dataset.id;store.list=store.list.filter(x=>x.id!==id);ui.confirmDel=null;saveLocal();if(remote){try{remote.doc(id).delete();}catch(e){}}render();}
  else if(act==="tab"){ui.tab=b.dataset.v;render();window.scrollTo(0,0);}
  else if(act==="filter"){ui.filter=b.dataset.v;render();}
  else if(act==="sec"){const i=+b.dataset.i;ui.open.has(i)?ui.open.delete(i):ui.open.add(i);render();}
  else if(act==="status"){const o=cur();if(o.final){toast("CAPA sudah final. Buka revisi di tab CAPA untuk mengubah.");return;}const no=+b.dataset.no,it=ITEMS.find(x=>x.no===no),a=getA(o,no),v=b.dataset.v;
    if(a.s===v){a.s="";}else{a.s=v;if(["MN","MJ","KT"].includes(v)){if(!a.pe)a.prob=autoProb(it,v);if(!a.re)a.ref=autoRef(o,it);}}
    touch();render();}
  else if(act==="capaOn"){const o=cur();if(o.final)return;const [k,v]=b.dataset.ref.split(":");if(k==="c"){getA(o,+v).capaOff=!b.checked;}else{const x=o.capaExtra.find(e=>e.id===v);if(x)x.on=b.checked;}touch();render();}
  else if(act==="xadd"){const o=cur();ensureCapa(o);o.capaExtra.push({id:uid(),cat:"MN",on:true});touch();render();}
  else if(act==="xdel"){const o=cur();o.capaExtra=o.capaExtra.filter(x=>x.id!==b.dataset.id);touch();render();}
  else if(act==="timAdd"){const o=cur();ensureCapa(o);o.tim.push({nama:""});touch();render();}
  else if(act==="timDel"){const o=cur();o.tim.splice(+b.dataset.p.split(".")[1],1);touch();render();}
  else if(act==="padClear"){const cv=document.querySelector('canvas[data-pad="'+b.dataset.p+'"]');if(cv){cv.getContext("2d").clearRect(0,0,cv.width,cv.height);delete cv.dataset.dirty;}}
  else if(act==="padSave"){const o=cur(),p=b.dataset.p,cv=document.querySelector('canvas[data-pad="'+p+'"]'),s=walk(o,p);
    if(!cv||!cv.dataset.dirty){toast("Area tanda tangan masih kosong");}
    else if(!s||!(s.nama||"").trim()){toast("Isi nama terang dulu");}
    else{s.img=normSig(cv);s.ts=Date.now();addLog(o,"Tanda tangan disimpan: "+s.nama);touch();render();toast("Tanda tangan tersimpan");}}
  else if(act==="sigReset"){const o=cur(),s=walk(o,b.dataset.p);if(s){addLog(o,"Tanda tangan dihapus: "+(s.nama||""));delete s.img;delete s.ts;touch();render();}}
  else if(act==="finalize"){const o=cur();ensureCapa(o);const ok=o.sig.pj.img&&o.tim.length>0&&o.tim.every(m=>m.img)&&capaRows(o).some(r=>r.on);
    if(!ok){toast("Lengkapi tanda tangan pimpinan dan semua anggota tim dulu");}else{o.final={ts:Date.now()};addLog(o,"CAPA difinalisasi");touch();render();window.scrollTo(0,0);}}
  else if(act==="revAsk"){ui.confirmRev=true;render();}
  else if(act==="revNo"){ui.confirmRev=false;render();}
  else if(act==="revYes"){const o=cur();o.final=null;o.rev=(o.rev||0)+1;[o.sig.pj,...o.tim].forEach(s=>{delete s.img;delete s.ts;});addLog(o,"Revisi "+o.rev+" dibuka. Tanda tangan dikosongkan.");ui.confirmRev=false;touch();render();}
  else if(act==="printCapa")printCapa();
  else if(act==="xlsx")doXlsx();
  else if(act==="docx")doDocx();
  else if(act==="csvAll")doCsvAll();
  else if(act==="csv")doCsv();
  else if(act==="copyRow"){copyText(tsv([recapRow(cur())]),"Baris rekap disalin. Tempel di Google Sheets.");}
  else if(act==="copyAll"){copyText(tsv([recapHeader(),...store.list.map(recapRow)]),"Rekap disalin. Tempel di Google Sheets.");}
});
document.addEventListener("input",e=>{
  const el=e.target,o=cur();if(!o)return;
  if(el.dataset.p){setPath(o,el.dataset.p,el.value);touch();}
  else if(el.dataset.x){const x=(o.capaExtra||[]).find(e=>e.id===el.dataset.x);if(x){x[el.dataset.f]=el.value;touch();}}
  else if(el.dataset.sg){const parts=el.dataset.sg.split("."),key=parts.pop(),obj=walk(o,parts.join("."));if(obj){obj[key]=el.value;touch();}}
  else if(el.dataset.f){const a=getA(o,+el.dataset.no);a[el.dataset.f]=el.value;if(el.dataset.f==="prob")a.pe=1;if(el.dataset.f==="ref")a.re=1;touch();}
});
document.addEventListener("change",e=>{const el=e.target;if(el.tagName==="SELECT"&&el.dataset.p){const o=cur();setPath(o,el.dataset.p,el.value);touch();}});

loadLocal();render();initRemote();
if(teamOn()){store.list.filter(o=>o.shared).forEach((o,i)=>setTimeout(()=>syncNow(o.id),500+i*700));tmLoadList();}

</script>

</body></html>
